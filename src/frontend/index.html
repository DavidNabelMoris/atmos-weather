<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos Weather</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="weather-clear day">
    <svg class="hidden" aria-hidden="true">
        <defs>
            <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="1" result="turbulence" />
                <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="24" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>
    <div class="app">
        <header class="topbar glass-2">
            <button class="icon-btn" id="menuBtn" aria-label="Menu">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
                </svg>
            </button>
            <button class="location-pill" id="locationBtn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
                </svg>
                <span id="locationText">Loading…</span>
                <svg class="edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
            <button class="icon-btn" id="favoriteBtn" aria-label="Favorites">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/>
                </svg>
            </button>

            <div class="search-panel glass-2 hidden" id="searchPanel">
                <div class="search-input-wrap">
                    <input id="citySearch" class="body-small" placeholder="Search city…" autocomplete="off">
                    <div class="search-suggestions hidden" id="searchSuggestions"></div>
                </div>
                <button id="citySearchBtn" class="btn btn-primary btn-sm">Go</button>
            </div>
        </header>

        <div class="side-menu-backdrop" id="sideMenuBackdrop"></div>
        <aside class="side-menu glass-3" id="sideMenu">
            <div class="side-menu-header">
                <h3 class="h3">Favorites</h3>
                <button class="icon-btn" id="sideMenuCloseBtn" aria-label="Close menu">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/>
                    </svg>
                </button>
            </div>
            <div class="side-menu-current body-small" id="sideMenuCurrent">—</div>
            <button class="btn btn-primary" id="saveFavoriteBtn">☆ Save this city</button>
            <div class="favorites-list" id="favoritesList"></div>
        </aside>

        <section class="time-card glass-2">
            <div class="time-block">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
                </svg>
                <div>
                    <div class="time" id="localTime">--:--</div>
                    <div class="date caption" id="localDate">—</div>
                </div>
            </div>
            <div class="tz-block">
                <div class="tz-id caption" id="tzId">—</div>
                <div class="tz-offset micro" id="tzOffset">—</div>
            </div>
        </section>

        <section class="hero-card glass-3">
            <div class="hero-main">
                <div class="temp-display"><span id="temp">--</span><span class="deg">&deg;</span><span class="unit">c</span></div>
                <div class="hero-text">
                    <div class="condition-icon" id="conditionIcon"></div>
                    <div class="condition-text h2" id="conditionText">—</div>
                    <div class="feels-like body-small" id="feelsLike">—</div>
                    <div class="hero-badges">
                        <span class="badge badge-rain" id="rainBadge"></span>
                        <span class="badge hidden" id="aqiBadge"></span>
                    </div>
                </div>
            </div>
            <div class="hourly-row" id="hourlyRow"></div>
        </section>

        <section class="bottom-row">
            <div class="card glass-2 conditions-card">
                <div class="conditions-header">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 15h9.5a3.75 3.75 0 0 0 .47-7.47A5.25 5.25 0 0 0 7.14 6.9 3.75 3.75 0 0 0 7 15z"/>
                    </svg>
                    <h3 class="h3">Conditions</h3>
                </div>
                <div class="conditions-list">
                    <div class="condition-row">
                        <span class="label" id="humidityIcon">Humidity</span>
                        <span class="value" id="humidityValue">--%</span>
                    </div>
                    <div class="condition-row">
                        <span class="label" id="rainChanceIcon">Chance of rain</span>
                        <span class="value" id="rainChanceValue">--%</span>
                    </div>
                    <div class="condition-row">
                        <span class="label" id="windIcon">Wind</span>
                        <span class="value" id="windValue">-- km/h</span>
                    </div>
                    <div class="condition-row">
                        <span class="label" id="uvIcon">UV Index</span>
                        <span class="value" id="uvValue">--</span>
                    </div>
                    <div class="condition-row">
                        <span class="label" id="visIcon">Visibility</span>
                        <span class="value" id="visValue">-- km</span>
                    </div>
                </div>
            </div>

            <div class="card glass-2 forecast-card">
                <h3 class="h3">3-day forecast</h3>
                <div class="forecast-list" id="forecastList"></div>
            </div>

            <div class="card glass-2 sunmoon-card">
                <h3 class="h3">Sun &amp; Moon</h3>
                <div class="sun-row"><span id="sunriseIcon"></span><span>Sunrise</span><span id="sunrise">—</span></div>
                <div class="sun-row"><span id="sunsetIcon"></span><span>Sunset</span><span id="sunset">—</span></div>
                <div class="moon-row">
                    <span class="moon-label" id="moonIconLabel">Moon</span>
                    <span id="moonPhase" class="body-small">—</span>
                </div>
            </div>
        </section>

        <footer class="app-footer micro" id="alertBanner"></footer>
    </div>
    <script type="module" src="../../dist/frontend/app.js"></script>
</body>
</html>
